name: Controlli

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Dipendenze
        run: bun install --frozen-lockfile

      # Typecheck (webview e processo principale), oxlint, test.
      - name: Controlli
        run: bun run check
